name: Bug report
description: Report a reproducible problem in Casting Defect AI.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not upload confidential production images, personal data, credentials, or proprietary datasets."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start the app ... 2. Upload a permitted sample ... 3. Click Run inspection ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, browser, package version"
  - type: textarea
    id: logs
    attributes:
      label: Relevant error message or logs
      description: Remove tokens, credentials, personal information, and private paths before posting.
